name: Actualizar datos

on:
  schedule:
       - cron: "5 19 * * *"    # todos los días a las 16:05 de Argentina (19:05 UTC), después de que el INDEC publica
  workflow_dispatch:         # botón "Run workflow" para actualizar a mano

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bajar datos y generar site/data/datos.json
        env:
          INDEC_TOKEN: ${{ secrets.INDEC_TOKEN }}
        run: python scripts/actualizar.py
      - name: Guardar los datos nuevos en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/datos.json
          git diff --cached --quiet || git commit -m "Actualizar datos $(date -u +%Y-%m-%d)"
          git push
